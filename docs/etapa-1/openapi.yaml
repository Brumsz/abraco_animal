openapi: 3.1.0
info:
  title: Abraço Animal API
  version: 0.1.0-esboco
  description: |
    Esboço do contrato da API da ONG Abraço Animal (Etapa 1).
    - Todos os `id` são UUID (publicId). IDs internos nunca são expostos.
    - Erros seguem RFC 9457 (`application/problem+json`).
    - Payloads de entrada são estritos: campos desconhecidos → 400.
    - Rotas `/admin/*` exigem role ADMIN (validada no use case).
    - Será gerado automaticamente a partir dos schemas Zod (fastify-type-provider-zod) na implementação;
      este arquivo é o contrato de referência para aprovação.
servers:
  - url: http://localhost:3333/v1
    description: Desenvolvimento
  - url: https://api-staging.abracoanimal.org.br/v1
    description: Staging
  - url: https://api.abracoanimal.org.br/v1
    description: Produção

security:
  - bearerAuth: []

tags:
  - name: health
    description: Health checks
  - name: auth
    description: Cadastro, login, tokens e recuperação de senha
  - name: me
    description: Dados e atividades do usuário autenticado
  - name: animais
    description: Animais da ONG
  - name: adocoes
    description: Solicitações de adoção
  - name: doacoes-animais
    description: Doação de animais para a ONG
  - name: doacoes-financeiras
    description: Doações via Pix (Asaas)
  - name: webhooks
    description: Webhooks de provedores externos
  - name: apadrinhamentos
    description: Programa de apadrinhamento
  - name: voluntariado
    description: Candidaturas de voluntariado
  - name: feed
    description: Posts da ONG
  - name: noticias
    description: Jornal Abraço Animal
  - name: institucional
    description: Sobre a ONG e FAQ
  - name: chat
    description: Chat com a ONG
  - name: notificacoes
    description: Notificações in-app e push
  - name: admin
    description: Painel administrativo (role ADMIN)

paths:
  # ───────────────────────────── HEALTH ─────────────────────────────
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      security: []
      servers: [{ url: / }]
      summary: Processo vivo
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      security: []
      servers: [{ url: / }]
      summary: Dependências (Postgres, Redis, S3) prontas
      responses:
        '200': { $ref: '#/components/responses/HealthOk' }
        '503': { $ref: '#/components/responses/Erro' }

        '4XX': { $ref: '#/components/responses/Erro' }
  # ────────────────────────────── AUTH ──────────────────────────────
  /auth/cadastro:
    post:
      tags: [auth]
      operationId: cadastrar
      security: []
      summary: Cria conta de USUARIO
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEntrada' }
      responses:
        '201':
          description: Conta criada e sessão iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoSaida' }
        '400': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Login (5 tentativas / 15 min por IP, bloqueio progressivo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginEntrada' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoSaida' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: Rotaciona o refresh token. Reuso de token já rotacionado revoga toda a família.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshEntrada' }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoSaida' }
        '401': { $ref: '#/components/responses/Erro' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoga a sessão atual (sid e jti no Redis)
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Erro' }
  /auth/recuperar-senha/solicitar:
    post:
      tags: [auth]
      operationId: solicitarRecuperacaoSenha
      security: []
      summary: Envia código de 6 dígitos (3 / hora por e-mail). Sempre 202, exista ou não a conta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'Se a conta existir, o código foi enviado' }
        '429': { $ref: '#/components/responses/Erro' }
  /auth/recuperar-senha/verificar-codigo:
    post:
      tags: [auth]
      operationId: verificarCodigoRecuperacao
      security: []
      summary: Valida o código e devolve um token de redefinição de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, codigo]
              properties:
                email: { type: string, format: email }
                codigo: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Código válido
          content:
            application/json:
              schema:
                type: object
                required: [tokenRedefinicao]
                properties:
                  tokenRedefinicao: { type: string }
        '400': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }
  /auth/recuperar-senha/redefinir:
    post:
      tags: [auth]
      operationId: redefinirSenha
      security: []
      summary: Define nova senha e revoga todas as sessões do usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenRedefinicao, novaSenha]
              properties:
                tokenRedefinicao: { type: string }
                novaSenha: { $ref: '#/components/schemas/Senha' }
      responses:
        '204': { description: Senha redefinida }
        '400': { $ref: '#/components/responses/Erro' }

  # ─────────────────────────────── ME ───────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: obterPerfil
      summary: Meu perfil
      responses:
        '200':
          description: Perfil do usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioPerfil' }
        '401': { $ref: '#/components/responses/Erro' }
    patch:
      tags: [me]
      operationId: editarPerfil
      summary: Edita meu perfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarPerfilEntrada' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioPerfil' }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
    delete:
      tags: [me]
      operationId: excluirConta
      summary: Soft delete + anonimização LGPD (adoções mantidas sem vínculo nominativo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senha, confirmacao]
              properties:
                senha: { type: string }
                confirmacao: { type: string, const: EXCLUIR }
      responses:
        '204': { description: Conta excluída }
        '401': { $ref: '#/components/responses/Erro' }
  /me/senha:
    post:
      tags: [me]
      operationId: alterarSenha
      summary: Altera minha senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual: { type: string }
                novaSenha: { $ref: '#/components/schemas/Senha' }
      responses:
        '204': { description: Senha alterada; outras sessões revogadas }
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
  /me/foto:
    post:
      tags: [me]
      operationId: enviarFotoPerfil
      summary: Envia foto de perfil ou capa
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipo]
              properties:
                tipo: { type: string, enum: [PERFIL, CAPA] }
                arquivo: { type: string, format: binary }
      responses:
        '200':
          description: Foto atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioPerfil' }
        '413': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
  /me/exportacao:
    get:
      tags: [me]
      operationId: exportarDados
      summary: Exportação LGPD de todos os dados do titular (inclui CPF decifrado apenas aqui)
      responses:
        '200':
          description: Dados do titular
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '429': { $ref: '#/components/responses/Erro' }
  /me/adocoes:
    get:
      tags: [me, adocoes]
      operationId: listarMinhasAdocoes
      summary: Minhas adoções
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Minhas adoções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAdocoes' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /me/doacoes-animais:
    get:
      tags: [me, doacoes-animais]
      operationId: listarMinhasDoacoesAnimais
      summary: Minhas doações de animais
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Minhas doações de animais
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDoacoesAnimais' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /me/doacoes-financeiras:
    get:
      tags: [me, doacoes-financeiras]
      operationId: listarMinhasDoacoesFinanceiras
      summary: Meu histórico de doações Pix
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Histórico Pix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDoacoesFinanceiras' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /me/apadrinhamentos:
    get:
      tags: [me, apadrinhamentos]
      operationId: listarMeusApadrinhamentos
      summary: Meus apadrinhamentos
      responses:
        '200':
          description: Animais apadrinhados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Apadrinhamento' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /me/voluntariado:
    get:
      tags: [me, voluntariado]
      operationId: obterMinhaCandidatura
      summary: Minha candidatura de voluntariado
      responses:
        '200':
          description: Candidatura de voluntariado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voluntario' }
        '404': { $ref: '#/components/responses/Erro' }

  # ───────────────────────────── ANIMAIS ────────────────────────────
  /animais:
    get:
      tags: [animais]
      operationId: listarAnimais
      security: [{}, { bearerAuth: [] }]
      summary: USUARIO/anônimo vê só DISPONIVEL; VOLUNTARIO e ADMIN podem filtrar por status
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoAnimal' } }
        - { name: porte, in: query, schema: { $ref: '#/components/schemas/Porte' } }
        - { name: sexo, in: query, schema: { $ref: '#/components/schemas/Sexo' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusAnimal' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de animais
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAnimais' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /animais/{id}:
    get:
      tags: [animais]
      operationId: obterAnimal
      summary: Detalhe do animal
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Detalhe do animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalDetalhe' }
        '404': { $ref: '#/components/responses/Erro' }
  /animais/{id}/padrinhos:
    get:
      tags: [animais, apadrinhamentos]
      operationId: listarPadrinhosAnimal
      summary: Padrinhos do animal
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Padrinhos ativos (nome e avatar apenas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PadrinhoResumo' }

        '4XX': { $ref: '#/components/responses/Erro' }
  # ───────────────────────────── ADOÇÕES ────────────────────────────
  /adocoes:
    post:
      tags: [adocoes]
      operationId: solicitarAdocao
      summary: Cria solicitação PENDENTE (10 / hora por usuário)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarAdocaoEntrada' }
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adocao' }
        '400': { $ref: '#/components/responses/Erro' }
        '409':
          {
            description: Já existe solicitação pendente ou animal indisponível,
            $ref: '#/components/responses/Erro',
          }
        '429': { $ref: '#/components/responses/Erro' }
  /adocoes/{id}:
    get:
      tags: [adocoes]
      operationId: obterAdocao
      summary: Apenas o solicitante ou ADMIN. Outro usuário → 403.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Detalhe com timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adocao' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  # ───────────────────────── DOAÇÕES DE ANIMAIS ─────────────────────
  /doacoes-animais:
    post:
      tags: [doacoes-animais]
      operationId: doarAnimal
      summary: Oferece um animal à ONG (até 10 fotos, 5MB cada; magic bytes validados)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dados]
              properties:
                dados: { $ref: '#/components/schemas/DoarAnimalEntrada' }
                fotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
            encoding:
              dados: { contentType: application/json }
      responses:
        '201':
          description: Doação registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoacaoAnimal' }
        '400': { $ref: '#/components/responses/Erro' }
        '413': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }
  /doacoes-animais/{id}:
    get:
      tags: [doacoes-animais]
      operationId: obterDoacaoAnimal
      summary: Detalhe da doação de animal
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoacaoAnimal' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  # ───────────────────────── DOAÇÕES FINANCEIRAS ────────────────────
  /doacoes-financeiras:
    post:
      tags: [doacoes-financeiras]
      operationId: gerarPix
      security: [{}, { bearerAuth: [] }]
      summary: Cria cobrança Pix no Asaas (expira em 15 min)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GerarPixEntrada' }
      responses:
        '201':
          description: Cobrança criada (ou a mesma, se Idempotency-Key repetida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoacaoFinanceira' }
        '400': { $ref: '#/components/responses/Erro' }
        '429': { $ref: '#/components/responses/Erro' }
        '502': { $ref: '#/components/responses/Erro' }
  /doacoes-financeiras/{id}/status:
    get:
      tags: [doacoes-financeiras]
      operationId: consultarStatusPix
      security: [{}, { bearerAuth: [] }]
      summary: Botão "Já paguei". Status vem do banco (atualizado pelo webhook) e, se PENDENTE, reconsultado no Asaas.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Status atual
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/StatusDoacaoFinanceira' }
                  paidAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '#/components/responses/Erro' }

  /webhooks/asaas:
    post:
      tags: [webhooks]
      operationId: webhookAsaas
      security: [{ asaasWebhookToken: [] }]
      summary: |
        Webhook do Asaas. Token comparado em tempo constante; evento deduplicado por id;
        status da cobrança SEMPRE reconsultado na API do Asaas antes de confirmar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, event]
              properties:
                id: { type: string }
                event:
                  { type: string, examples: [PAYMENT_RECEIVED, PAYMENT_CONFIRMED, PAYMENT_OVERDUE] }
                payment: { type: object, additionalProperties: true }
      responses:
        '200': { description: Recebido (também para eventos duplicados) }
        '401': { $ref: '#/components/responses/Erro' }

  # ─────────────────────────── APADRINHAMENTOS ──────────────────────
  /apadrinhamentos:
    post:
      tags: [apadrinhamentos]
      operationId: apadrinhar
      summary: Somente animais com status DISPONIVEL podem ser apadrinhados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [animalId]
              properties:
                animalId: { type: string, format: uuid }
                mensagemPadrinho: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Apadrinhamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Apadrinhamento' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { description: Já é padrinho deste animal, $ref: '#/components/responses/Erro' }
        '422':
          {
            description: Animal não está DISPONIVEL (codigo ANIMAL_NAO_APADRINHAVEL),
            $ref: '#/components/responses/Erro',
          }
  /apadrinhamentos/{id}:
    delete:
      tags: [apadrinhamentos]
      operationId: encerrarApadrinhamento
      summary: Marca ativo=false (somente o próprio padrinho)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Encerrado }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }

  # ───────────────────────────── VOLUNTARIADO ───────────────────────
  /voluntariado/candidaturas:
    post:
      tags: [voluntariado]
      operationId: candidatarVoluntario
      summary: Envia candidatura de voluntariado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidaturaEntrada' }
      responses:
        '201':
          description: Candidatura PENDENTE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voluntario' }
        '409': { $ref: '#/components/responses/Erro' }

  # ─────────────────────────────── FEED ─────────────────────────────
  /posts:
    get:
      tags: [feed]
      operationId: listarPosts
      summary: Feed de posts
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Posts publicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaPosts' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /posts/{id}:
    get:
      tags: [feed]
      operationId: obterPost
      summary: Detalhe do post
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/Erro' }
  /posts/{id}/curtida:
    post:
      tags: [feed]
      operationId: curtirPost
      summary: Curte o post
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Curtido (idempotente) }
        '4XX': { $ref: '#/components/responses/Erro' }
    delete:
      tags: [feed]
      operationId: descurtirPost
      summary: Remove a curtida
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Curtida removida (idempotente) }

        '4XX': { $ref: '#/components/responses/Erro' }
  # ───────────────────────────── NOTÍCIAS ───────────────────────────
  /noticias:
    get:
      tags: [noticias]
      operationId: listarNoticias
      summary: Lista notícias
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
