      operationId: adminAlterarRole
      summary: Promove a VOLUNTARIO ou rebaixa a USUARIO (promoção a ADMIN fora do app)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [USUARIO, VOLUNTARIO] }
      responses:
        '204': { description: Alterado }

        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/voluntarios:
    get:
      tags: [admin]
      operationId: adminListarVoluntarios
      summary: Lista voluntários e candidaturas
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusVoluntario' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Candidaturas / voluntários
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaVoluntarios' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/voluntarios/{id}/aprovar:
    post:
      tags: [admin]
      operationId: adminAprovarVoluntario
      summary: Aprova e promove o usuário a VOLUNTARIO
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cargo: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voluntario' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/voluntarios/{id}/recusar:
    post:
      tags: [admin]
      operationId: adminRecusarVoluntario
      summary: Recusa candidatura
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Recusa' }
      responses:
        '200':
          description: Recusado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voluntario' }

        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/conversas:
    get:
      tags: [admin]
      operationId: adminListarConversas
      summary: Lista conversas
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusConversa' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Conversas ordenadas por atualizadoEm desc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaConversas' }
        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/conversas/{id}/assumir:
    post:
      tags: [admin]
      operationId: adminAssumirConversa
      summary: Assume o atendimento
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Admin atribuído }
        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/conversas/{id}/encerrar:
    post:
      tags: [admin]
      operationId: adminEncerrarConversa
      summary: Encerra a conversa
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Encerrada }

        '4XX': { $ref: '#/components/responses/Erro' }
  /admin/auditoria:
    get:
      tags: [admin]
      operationId: adminListarAuditoria
      summary: Log de auditoria
      parameters:
        - { name: adminId, in: query, schema: { type: string, format: uuid } }
        - { name: entidade, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/De'
        - $ref: '#/components/parameters/Ate'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Log de auditoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }

        '4XX': { $ref: '#/components/responses/Erro' }
# ════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA/Ed25519, 15 min; claims sub, iat, exp, iss, aud, jti, sid, role)
    asaasWebhookToken:
      type: apiKey
      in: header
      name: asaas-access-token

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco retornado em `proximoCursor`
      schema: { type: string }
    Limite:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    De:
      name: de
      in: query
      schema: { type: string, format: date-time }
    Ate:
      name: ate
      in: query
      schema: { type: string, format: date-time }

  requestBodies:
    Recusa:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [motivoRecusa]
            properties:
              motivoRecusa: { type: string, minLength: 10, maxLength: 1000 }
    Publicacao:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [publicado]
            properties:
              publicado: { type: boolean }
    Reordenar:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ids]
            properties:
              ids:
                description: IDs na nova ordem
                type: array
                items: { type: string, format: uuid }
    FaqEntrada:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [pergunta, resposta]
            properties:
              pergunta: { type: string, maxLength: 200 }
              resposta: { type: string, maxLength: 5000 }
              publicado: { type: boolean }

  responses:
    Erro:
      description: Erro (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Erro' }
    HealthOk:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, const: ok }

  schemas:
    # ── Enums ──
    Role: { type: string, enum: [USUARIO, VOLUNTARIO, ADMIN] }
    TipoAnimal: { type: string, enum: [EQUINO, CANINO, BOVINO, OUTRO] }
    Sexo: { type: string, enum: [MACHO, FEMEA] }
    Porte: { type: string, enum: [PEQUENO, MEDIO, GRANDE, MUITO_GRANDE] }
    StatusAnimal: { type: string, enum: [DISPONIVEL, EM_TRATAMENTO, ADOTADO, INDISPONIVEL] }
    StatusAdocao: { type: string, enum: [PENDENTE, APROVADA, RECUSADA] }
    TipoMoradia:
      { type: string, enum: [CASA_COM_QUINTAL, CASA_SEM_QUINTAL, APARTAMENTO, CHACARA, FAZENDA] }
    StatusDoacaoAnimal: { type: string, enum: [PENDENTE, APROVADA, RECUSADA, RECEBIDA] }
    StatusDoacaoFinanceira: { type: string, enum: [PENDENTE, CONFIRMADA, EXPIRADA] }
    StatusConversa: { type: string, enum: [ABERTA, ENCERRADA] }
    SecaoPerfilOng: { type: string, enum: [SOBRE_NOS, FUNDACAO, FUNDADORES] }
    StatusVoluntario: { type: string, enum: [PENDENTE, APROVADO, RECUSADO] }
    AreaInteresse:
      {
        type: string,
        enum: [CUIDADO_ANIMAIS, EVENTOS, REDES_SOCIAIS, TRANSPORTE, CAPTACAO_RECURSOS, OUTROS],
      }
    DiaSemana: { type: string, enum: [DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO] }
    Turno: { type: string, enum: [MANHA, TARDE, NOITE] }
    TipoNotificacao:
      type: string
      enum:
        [
          ADOCAO_APROVADA,
          ADOCAO_RECUSADA,
          ADOCAO_ANIMAL_ADOTADO,
          DOACAO_ANIMAL_ATUALIZADA,
          DOACAO_FINANCEIRA_CONFIRMADA,
          VOLUNTARIADO_ATUALIZADO,
          CHAT_NOVA_MENSAGEM,
          GERAL,
        ]

    # ── Base ──
    Erro:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        codigo:
          {
            type: string,
            description: 'Código estável de domínio (ex.: ADOCAO_PENDENTE_DUPLICADA)',
          }
        erros:
          type: array
          description: Erros de validação por campo
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }
    Senha:
      type: string
      minLength: 8
      maxLength: 128
      description: Mín. 8 caracteres, com letra e número
    Foto:
      type: object
      required: [id, url, ordem]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: URL assinada (expira em 1h) }
        ordem: { type: integer }

    # ── Auth ──
    CadastroEntrada:
      type: object
      additionalProperties: false
      required:
        [nome, dataNasc, cpf, telefone, email, senha, endereco, aceitouTermos, consentimentoDados]
      properties:
        nome: { type: string, minLength: 3, maxLength: 120 }
        dataNasc:
          {
            type: string,
            format: date,
            description: 'Idade mínima de 18 anos (codigo IDADE_MINIMA)',
          }
        cpf: { type: string, pattern: '^[0-9]{11}$', description: Somente dígitos; DV validado }
        telefone: { type: string, pattern: '^[0-9]{10,11}$' }
        email: { type: string, format: email }
        senha: { $ref: '#/components/schemas/Senha' }
        endereco: { $ref: '#/components/schemas/Endereco' }
        aceitouTermos: { type: boolean, const: true }
        consentimentoDados: { type: boolean, const: true }
        deviceId: { type: string, maxLength: 128 }
    LoginEntrada:
      type: object
      additionalProperties: false
      required: [email, senha, deviceId]
      properties:
        email: { type: string, format: email }
        senha: { type: string }
        deviceId: { type: string, maxLength: 128 }
    RefreshEntrada:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceId]
      properties:
        refreshToken: { type: string }
        deviceId: { type: string }
    SessaoSaida:
      type: object
      required: [accessToken, refreshToken, expiraEm, usuario]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: string, format: date-time }
        usuario: { $ref: '#/components/schemas/UsuarioPerfil' }

    # ── Usuário ──
    Endereco:
      type: object
      additionalProperties: false
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: string, maxLength: 200 }
        numero: { type: string, maxLength: 20 }
        complemento: { type: [string, 'null'], maxLength: 100 }
        bairro: { type: string, maxLength: 100 }
        cidade: { type: string, maxLength: 100 }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
    UsuarioPerfil:
      type: object
      description: Nunca contém senha, CPF ou data de nascimento
      required: [id, nome, email, role]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        endereco: { $ref: '#/components/schemas/Endereco' }
        fotoUrl: { type: [string, 'null'], format: uri }
        capaUrl: { type: [string, 'null'], format: uri }
        role: { $ref: '#/components/schemas/Role' }
        criadoEm: { type: string, format: date-time }
    EditarPerfilEntrada:
      type: object
      additionalProperties: false
      properties:
        nome: { type: string, minLength: 3, maxLength: 120 }
        telefone: { type: string, pattern: '^[0-9]{10,11}$' }
        endereco: { $ref: '#/components/schemas/Endereco' }
    UsuarioAdmin:
      allOf:
        - $ref: '#/components/schemas/UsuarioPerfil'
        - type: object
          properties:
            ativo: { type: boolean }
            cpfMascarado: { type: string, examples: ['***.456.789-**'] }

    # ── Animais ──
    AnimalResumo:
      type: object
      required: [id, nome, tipo, raca, idadeAprox, porte, sexo, status]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoAnimal' }
        raca: { type: string }
        idadeAprox: { type: integer, description: meses }
        sexo: { $ref: '#/components/schemas/Sexo' }
        porte: { $ref: '#/components/schemas/Porte' }
        status: { $ref: '#/components/schemas/StatusAnimal' }
        fotoCapa: { oneOf: [{ $ref: '#/components/schemas/Foto' }, { type: 'null' }] }
    AnimalDetalhe:
      allOf:
        - $ref: '#/components/schemas/AnimalResumo'
        - type: object
          required: [descricao, historiaResgate, vacinado, castrado, fotos]
          properties:
            descricao: { type: string }
            historiaResgate: { type: string }
            vacinado: { type: boolean }
            castrado: { type: boolean }
            fotos:
              type: array
              items: { $ref: '#/components/schemas/Foto' }
            totalPadrinhos: { type: integer }
    AnimalEntrada:
      type: object
      additionalProperties: false
      required: [nome, tipo, raca, idadeAprox, sexo, porte, descricao, historiaResgate]
      properties:
        nome: { type: string, maxLength: 80 }
        tipo: { $ref: '#/components/schemas/TipoAnimal' }
        raca: { type: string, maxLength: 80 }
        idadeAprox: { type: integer, minimum: 0, maximum: 600 }
        sexo: { $ref: '#/components/schemas/Sexo' }
        porte: { $ref: '#/components/schemas/Porte' }
        descricao: { type: string, maxLength: 5000 }
        historiaResgate: { type: string, maxLength: 10000 }
        vacinado: { type: boolean }
        castrado: { type: boolean }
        status: { $ref: '#/components/schemas/StatusAnimal' }
    PadrinhoResumo:
      type: object
      properties:
        nome: { type: string, description: Primeiro nome }
        fotoUrl: { type: [string, 'null'], format: uri }
        mensagemPadrinho: { type: [string, 'null'] }

    # ── Adoções ──
    SolicitarAdocaoEntrada:
      type: object
      additionalProperties: false
      required: [animalId, tipoMoradia, possuiEspacoAdequado, motivo, aceitouTermo]
      properties:
        animalId: { type: string, format: uuid }
        tipoMoradia: { $ref: '#/components/schemas/TipoMoradia' }
        possuiEspacoAdequado: { type: boolean }
        outrosAnimais: { type: string, maxLength: 1000 }
        motivo: { type: string, minLength: 50, maxLength: 3000 }
        aceitouTermo: { type: boolean, const: true }
    Adocao:
      type: object
      required: [id, status, animal, criadoEm]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusAdocao' }
        animal: { $ref: '#/components/schemas/AnimalResumo' }
        tipoMoradia: { $ref: '#/components/schemas/TipoMoradia' }
        possuiEspacoAdequado: { type: boolean }
        outrosAnimais: { type: [string, 'null'] }
        motivo: { type: string }
        termoAceitoEm: { type: string, format: date-time }
        analisadoEm: { type: [string, 'null'], format: date-time }
        motivoRecusa: { type: [string, 'null'] }
        recusaAutomatica:
          type: boolean
          description: true quando recusada porque o animal foi adotado por outra pessoa
        criadoEm: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              etapa: { type: string, enum: [ENVIADA, EM_ANALISE, APROVADA, RECUSADA] }
              em: { type: [string, 'null'], format: date-time }
    AdocaoAdmin:
      allOf:
        - $ref: '#/components/schemas/Adocao'
        - type: object
          properties:
            solicitante: { $ref: '#/components/schemas/UsuarioAdmin' }
            analisadoPor: { type: [string, 'null'], description: Nome do admin }

    # ── Doação de animal ──
    DoarAnimalEntrada:
      type: object
      additionalProperties: false
      required:
        [nomeAnimal, tipo, raca, idadeAprox, sexo, porte, descricao, motivoDoacao, enderecoRetirada]
      properties:
        nomeAnimal: { type: string, maxLength: 80 }
        tipo: { $ref: '#/components/schemas/TipoAnimal' }
        raca: { type: string, maxLength: 80 }
        idadeAprox: { type: integer, minimum: 0, maximum: 600 }
        sexo: { $ref: '#/components/schemas/Sexo' }
        porte: { $ref: '#/components/schemas/Porte' }
        descricao: { type: string, maxLength: 5000 }
        motivoDoacao: { type: string, maxLength: 3000 }
        enderecoRetirada: { type: string, maxLength: 500 }
    DoacaoAnimal:
      allOf:
        - $ref: '#/components/schemas/DoarAnimalEntrada'
        - type: object
          required: [id, status, criadoEm]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/StatusDoacaoAnimal' }
            fotos:
              type: array
              items: { $ref: '#/components/schemas/Foto' }
            motivoRecusa: { type: [string, 'null'] }
            analisadoEm: { type: [string, 'null'], format: date-time }
            animalCriadoId: { type: [string, 'null'], format: uuid }
            criadoEm: { type: string, format: date-time }

    # ── Doação financeira ──
    GerarPixEntrada:
      type: object
      additionalProperties: false
      required: [valor]
      properties:
        valor:
          type: string
          pattern: '^[0-9]{1,8}\.[0-9]{2}$'
          description: Decimal como string (ex. "50.00"); mín. 5.00
        anonima: { type: boolean, default: false }
        nomeDoador: { type: string, maxLength: 120, description: Apenas sem login }
        emailDoador: { type: string, format: email, description: Para comprovante }
    DoacaoFinanceira:
      type: object
      required: [id, valor, status, pixCopiaCola, expiresAt]
      properties:
        id: { type: string, format: uuid }
        valor: { type: string, examples: ['50.00'] }
        status: { $ref: '#/components/schemas/StatusDoacaoFinanceira' }
        pixCopiaCola:
          { type: string, description: O app gera o QR Code localmente a partir deste código }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time }

    # ── Apadrinhamento / Voluntariado ──
    Apadrinhamento:
      type: object
      required: [id, animal, ativo, criadoEm]
      properties:
        id: { type: string, format: uuid }
        animal: { $ref: '#/components/schemas/AnimalResumo' }
        ativo: { type: boolean }
        mensagemPadrinho: { type: [string, 'null'] }
        criadoEm: { type: string, format: date-time }
    CandidaturaEntrada:
      type: object
      additionalProperties: false
      required: [areasInteresse, disponibilidadeDias, turnos, motivacao]
      properties:
        areasInteresse:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/AreaInteresse' }
        areaInteresseOutros: { type: string, maxLength: 200 }
        disponibilidadeDias:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DiaSemana' }
        turnos:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Turno' }
        motivacao: { type: string, minLength: 20, maxLength: 3000 }
        habilidades: { type: string, maxLength: 3000 }
    Voluntario:
      allOf:
        - $ref: '#/components/schemas/CandidaturaEntrada'
        - type: object
          required: [id, status, criadoEm]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/StatusVoluntario' }
            cargo: { type: [string, 'null'] }
            motivoRecusa: { type: [string, 'null'] }
            usuario: { $ref: '#/components/schemas/UsuarioPerfil' }
            criadoEm: { type: string, format: date-time }

    # ── Conteúdo ──
    Post:
      type: object
      required: [id, legenda, imagens, totalCurtidas, curtidoPorMim, criadoEm]
      properties:
        id: { type: string, format: uuid }
        legenda: { type: string }
        imagens:
          type: array
          items: { $ref: '#/components/schemas/Foto' }
        totalCurtidas: { type: integer }
        curtidoPorMim: { type: boolean }
        publicado: { type: boolean, description: Apenas para ADMIN }
        criadoEm: { type: string, format: date-time }
    Noticia:
      type: object
      required: [id, slug, titulo, resumo, criadoEm]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        titulo: { type: string }
        resumo: { type: string }
        conteudo: { type: string, description: Markdown sanitizado (ausente na listagem) }
        imagem: { type: [string, 'null'], format: uri }
        publicado: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    NoticiaEntrada:
      type: object
      additionalProperties: false
      required: [titulo, resumo, conteudo]
      properties:
        titulo: { type: string, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9-]+$', description: Gerado do título se omitido }
        resumo: { type: string, maxLength: 300 }
        conteudo: { type: string, maxLength: 50000 }
        imagem: { type: string, description: Chave de upload prévio }
    PerfilOngSecao:
      type: object
      required: [secao, titulo, conteudo]
      properties:
        secao: { $ref: '#/components/schemas/SecaoPerfilOng' }
        titulo: { type: string }
        conteudo: { type: string }
        publicado: { type: boolean }
        atualizadoEm: { type: string, format: date-time }
    Faq:
      type: object
      required: [id, pergunta, resposta, ordem]
      properties:
        id: { type: string, format: uuid }
        pergunta: { type: string }
        resposta: { type: string }
        ordem: { type: integer }
        publicado: { type: boolean }

    # ── Chat / Notificações ──
    Conversa:
      type: object
      required: [id, status, criadoEm]
      properties:
        id: { type: string, format: uuid }
        assunto: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/StatusConversa' }
        usuario: { $ref: '#/components/schemas/UsuarioPerfil' }
        atendente: { type: [string, 'null'], description: Nome do admin }
        ultimaMensagem: { oneOf: [{ $ref: '#/components/schemas/Mensagem' }, { type: 'null' }] }
        naoLidas: { type: integer }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    Mensagem:
      type: object
      required: [id, conteudo, autorEhEquipe, lida, criadoEm]
      properties:
        id: { type: string, format: uuid }
        conteudo: { type: string }
        autorId: { type: string, format: uuid }
        autorEhEquipe: { type: boolean }
        lida: { type: boolean }
        lidaEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time }
    Notificacao:
      type: object
      required: [id, tipo, titulo, corpo, criadoEm]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoNotificacao' }
        titulo: { type: string }
        corpo: { type: string }
        entidadeId:
          type: [string, 'null']
          format: uuid
          description: O app monta a rota a partir de tipo + entidadeId (o servidor nunca envia deep links livres)
        lidaEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time }

    # ── Admin ──
    Dashboard:
      type: object
      properties:
        adocoesPendentes: { type: integer }
        doacoesAnimaisPendentes: { type: integer }
        animaisDisponiveis: { type: integer }
        doacoesFinanceirasMes:
          type: object
          properties:
            quantidade: { type: integer }
            total: { type: string, examples: ['1250.00'] }
        adocoesPorMes:
          type: array
          maxItems: 6
          items:
            type: object
            properties:
              mes: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
              total: { type: integer }
        ultimasPendencias:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              tipo: { type: string, enum: [ADOCAO, DOACAO_ANIMAL, VOLUNTARIO] }
              id: { type: string, format: uuid }
              titulo: { type: string }
              criadoEm: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, admin, acao, entidade, entidadeId, criadoEm]
      properties:
        id: { type: string, format: uuid }
        admin:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        acao: { type: string }
        entidade: { type: string }
        entidadeId: { type: string }
        detalhe: { type: [object, 'null'], additionalProperties: true }
        criadoEm: { type: string, format: date-time }

    # ── Páginas (cursor) ──
    PaginaAnimais:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/AnimalResumo' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaAdocoes:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Adocao' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaDoacoesAnimais:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/DoacaoAnimal' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaDoacoesFinanceiras:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/DoacaoFinanceira' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaPosts:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Post' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaNoticias:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Noticia' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaMensagens:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Mensagem' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaConversas:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Conversa' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaNotificacoes:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Notificacao' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaUsuarios:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/UsuarioAdmin' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaVoluntarios:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Voluntario' } }
        proximoCursor: { type: [string, 'null'] }
    PaginaAuditoria:
      type: object
      required: [itens, proximoCursor]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        proximoCursor: { type: [string, 'null'] }

x-websocket:
  /ws/chat:
    descricao: |
      WebSocket autenticado (access token enviado na primeira mensagem `{tipo:"auth", token}`,
      nunca na query string). Eventos do servidor: `mensagem.nova`, `mensagem.lida`, `conversa.encerrada`.
      Eventos do cliente: `digitando`, `lida`. Fallback: polling em GET /conversas/{id}/mensagens.
