name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Lint, typecheck e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Gerar Prisma Client
        run: pnpm --filter @abraco/api prisma:generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Contrato OpenAPI e tipos do api-client em dia com as rotas
        run: |
          pnpm --filter @abraco/shared build
          pnpm api:gerar
          git diff --exit-code -- packages/api-client \
            || { echo "::error::Rotas mudaram sem regenerar o contrato. Rode 'pnpm api:gerar' e commite."; exit 1; }

      - name: Lint, typecheck e testes unitários
        run: pnpm turbo run lint typecheck test

  integracao:
    name: Integração e segurança (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client e compilar pacotes
        run: |
          DATABASE_URL=postgresql://build:build@localhost:5432/build pnpm --filter @abraco/api prisma:generate
          pnpm --filter @abraco/shared build

      - name: Testes de integração (Postgres e Redis reais)
        run: pnpm --filter @abraco/api test:integration

  migracoes:
    name: Migrações Prisma
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: abraco_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d abraco_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/abraco_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validar schema
        working-directory: apps/api
        run: pnpm prisma:validate

      - name: Aplicar migrações num banco vazio
        working-directory: apps/api
        run: pnpm db:deploy

      - name: Schema e migrações estão em sincronia (sem drift)
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Índices únicos parciais (adoção pendente e conversa aberta) existem
        run: |
          for indice in adocoes_pendente_unica conversas_aberta_unica; do
            psql "postgresql://ci:ci@localhost:5432/abraco_ci" -tAc \
              "select 1 from pg_indexes where indexname = '$indice'" | grep -q 1 \
              || { echo "índice $indice não encontrado"; exit 1; }
          done

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Bloqueia: vulnerabilidade alta ou crítica no que vai para produção.
      - name: Dependências de produção (alta ou crítica falha)
        run: pnpm audit --prod --audit-level high

      # Só informa: ferramentas de desenvolvimento não rodam em produção.
      - name: Dependências de desenvolvimento (só relatório)
        run: pnpm audit --audit-level high || echo "::warning::Há vulnerabilidades em dependências de desenvolvimento (ver log)."

  imagem:
    name: Imagem Docker da API (build + Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publicar no GHCR (só na main)
      security-events: write # relatório do Trivy na aba Security
    env:
      IMAGEM: ghcr.io/${{ github.repository }}/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: abraco-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades (Trivy) — falha com alta/crítica corrigível
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image --exit-code 1 --ignore-unfixed \
            --severity HIGH,CRITICAL --scanners vuln abraco-api:ci

      - name: Relatório completo do Trivy (SARIF)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/saida" \
            aquasec/trivy:0.76.2 image --format sarif --output /saida/trivy.sarif \
            --scanners vuln abraco-api:ci

      - name: Enviar relatório para a aba Security
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-imagem-api

      # Publica só o que já passou pelo scan, e só a partir da main.
      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag abraco-api:ci "$IMAGEM:${GITHUB_SHA}"
          docker tag abraco-api:ci "$IMAGEM:main"
          docker push "$IMAGEM:${GITHUB_SHA}"
          docker push "$IMAGEM:main"
