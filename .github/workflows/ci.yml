name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Lint, typecheck e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint, typecheck e testes unitários
        run: pnpm turbo run lint typecheck test

  migracoes:
    name: Migrações Prisma
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: abraco_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d abraco_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/abraco_ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validar schema
        working-directory: apps/api
        run: pnpm prisma:validate

      - name: Aplicar migrações num banco vazio
        working-directory: apps/api
        run: pnpm db:deploy

      - name: Schema e migrações estão em sincronia (sem drift)
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Índice único parcial de adoção existe
        run: |
          psql "postgresql://ci:ci@localhost:5432/abraco_ci" -tAc \
            "select 1 from pg_indexes where indexname = 'adocoes_pendente_unica'" | grep -q 1
